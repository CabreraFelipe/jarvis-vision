name: Validar y publicar JARVIS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'app/**'
      - 'manager.py'
      - 'build_release.py'
      - 'test_release.py'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: jarvis-release
  cancel-in-progress: false
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install numpy opencv-python-headless Pillow
      - name: Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Pruebas unitarias de aplicación
        working-directory: app
        run: python -m unittest test_jarvis test_v04 test_wake041
      - name: Pruebas del canal
        run: python -m unittest test_release
      - name: Interfaz simulada Linux
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          xvfb-run -a python test_ui.py
          xvfb-run -a python test_voice_ui.py
      - name: Interfaz simulada Windows
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          python test_ui.py
          python test_voice_ui.py
  release:
    needs: tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construir archivos
        run: python build_release.py "$GITHUB_REPOSITORY" dist
      - name: Crear release validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(cat VERSION)
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if printf '%s\n' "$tags" | grep -Fxq "v$version"; then
            echo "Version v$version already published; never overwrite an existing release."
            exit 0
          fi
          gh release create "v$version" "dist/JARVIS_Vision_V$version.zip" dist/feed.json --target "$GITHUB_SHA" --title "JARVIS Vision V$version" --notes "Pruebas automatizadas Linux y Windows superadas. Dispositivos simulados. Instalación requiere confirmación local." --latest
